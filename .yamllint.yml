extends: default

rules:
  line-length:
    max: 200
    level: warning
  document-start:
    present: false
    level: warning
  truthy:
    check-keys: false
  indentation:
    indent-sequences: consistent
  comments:
    min-spaces-from-content: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  quoted-strings:
    quote-type: double
    required: only-when-needed